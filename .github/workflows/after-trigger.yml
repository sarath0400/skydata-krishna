name: After trigger
on:
  workflow_run:
    workflows: ["Trigger test"]
    types: [completed]
    branches: [develop]

jobs:
  pretend-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Linux, X64, gcp]
    steps:
      - name: Who woke me up?
        run: |
          echo "Event:          ${{ github.event_name }}"
          echo "Waited for:     ${{ github.event.workflow_run.name }}"
          echo "Its result:     ${{ github.event.workflow_run.conclusion }}"
          echo "Its branch:     ${{ github.event.workflow_run.head_branch }}"
