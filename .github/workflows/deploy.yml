# Mirrors SkyStudio's deploy-prod.yml / deploy-dev.yml:
#   3 jobs — quality (lint + typecheck + test) and build-image run in parallel,
#   then deploy waits for both, repoints the Azure Web App at the new image,
#   restarts, health-checks, and notifies Teams.
name: Deploy Demo

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: false
        type: string
        default: "Manual deployment"

concurrency:
  group: deploy-demo
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  IMAGE_NAME: skydata-demo
  RESOURCE_GROUP: rg-skydata-demo
  WEBAPP_NAME: wapp-skydata-demo   # <-- must be globally unique; change to yours

jobs:
  # ============================================
  # Job 1: Quality (parallel with build-image)
  # ============================================
  quality:
    name: Quality Checks
    runs-on: [self-hosted, Linux, X64, gcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npm run lint:check
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test

  # ============================================
  # Job 2: Build + push Docker image (parallel with quality)
  # ============================================
  build-image:
    name: Build Docker Image
    runs-on: [self-hosted, Linux, X64, gcp]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Generate image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_DATE=$(date -u +"%Y%m%d-%H%M%S")
          echo "tag=${{ secrets.ACR_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${SHORT_SHA}-${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "latest=${{ secrets.ACR_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.latest }}
          build-args: |
            VITE_BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # ============================================
  # Job 3: Deploy (waits for quality + build-image)
  # ============================================
  deploy:
    name: Deploy
    needs: [quality, build-image]
    runs-on: [self-hosted, Linux, X64, gcp]
    env:
       TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}

    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Point web app at new image + restart
        run: |
          IMAGE="${{ secrets.ACR_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:latest"
          echo "Deploying image: $IMAGE"
          az webapp config container set \
            --name ${{ env.WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --docker-custom-image-name "$IMAGE" \
            --docker-registry-server-url https://${{ secrets.ACR_REGISTRY }}.azurecr.io \
            --docker-registry-server-user ${{ secrets.ACR_USERNAME }} \
            --docker-registry-server-password ${{ secrets.ACR_PASSWORD }}
          az webapp restart \
            --name ${{ env.WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }}
      - name: Health check
        run: |
          echo "Waiting for container to come up..."
          sleep 30
          for i in 1 2 3 4 5; do
            if curl -sf "https://${{ env.WEBAPP_NAME }}.azurewebsites.net/health"; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1
      - name: Notify Teams on success
        if: ${{ success() && env.TEAMS_WEBHOOK != '' }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          curl -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [{
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                "type": "AdaptiveCard",
                "version": "1.4",
                "body": [
                  {"type": "TextBlock", "text": "🚀 Demo Deployment Successful", "weight": "Bolder", "size": "Large", "color": "Good"},
                  {"type": "FactSet", "facts": [
                    {"title": "Branch", "value": "${{ github.ref_name }}"},
                    {"title": "Commit", "value": "'"$SHORT_SHA"'"},
                    {"title": "Author", "value": "${{ github.actor }}"}
                  ]}
                ],
                "actions": [
                  {"type": "Action.OpenUrl", "title": "Open App", "url": "https://${{ env.WEBAPP_NAME }}.azurewebsites.net"}
                ]
              }
            }]
          }' "${{ secrets.TEAMS_WEBHOOK }}"
      - name: Notify Teams on failure
        if: ${{ failure() && env.TEAMS_WEBHOOK != '' }}
        run: |
          curl -H "Content-Type: application/json" -d '{
            "type": "message",
            "attachments": [{
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                "type": "AdaptiveCard",
                "version": "1.4",
                "body": [
                  {"type": "TextBlock", "text": "❌ Demo Deployment Failed", "weight": "Bolder", "size": "Large", "color": "Attention"}
                ],
                "actions": [
                  {"type": "Action.OpenUrl", "title": "View Logs", "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
                ]
              }
            }]
          }' "${{ secrets.TEAMS_WEBHOOK }}"
